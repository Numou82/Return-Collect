<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="manifest" href="manifest.json">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline Return Collector</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body { 
            padding: 20px 10px; 
            background: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
            min-height: 100vh;
            color: #333;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        .login-screen-wrapper {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: #111827;
            display: flex; align-items: center; justify-content: center;
            z-index: 9999; padding: 15px;
        }

        .login-card {
            width: 100%; max-width: 400px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 16px; padding: 30px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
        }

        .autocomplete-wrapper { position: relative; }

        .autocomplete-suggestions {
            position: absolute; top: 100%; left: 0; right: 0;
            max-height: 200px; overflow-y: auto;
            background-color: #fff; border: 1px solid #ced4da;
            z-index: 9999; display: none;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .autocomplete-suggestion {
            padding: 10px 12px; cursor: pointer;
            border-bottom: 1px solid #f1f5f9; font-size: 0.95rem;
        }

        .autocomplete-suggestion:hover {
            background-color: #0e7490; color: #ffffff;
        }
    </style>
</head>
<body>

    <!-- LOGIN SECTION -->
    <div id="loginSection" class="login-screen-wrapper">
        <div class="card shadow login-card">
            <h3 class="text-center mb-1">Return Collector</h3>
            <p class="text-center text-muted small mb-4">Please log in to manage return invoices</p>
            
            <div class="mb-3">
                <label class="form-label text-secondary small"><b>User ID (Name):</b></label>
                <input type="text" id="loginId" class="form-control form-control-lg" placeholder="e.g. shahbaz">
            </div>
            <div class="mb-4">
                <label class="form-label text-secondary small"><b>Password:</b></label>
                <input type="password" id="loginPassword" class="form-control form-control-lg" placeholder="••••••••">
            </div>
            <button class="btn btn-primary btn-lg w-100 shadow-sm" onclick="handleLogin()" style="background: #0e7490; border: none;">Sign In</button>
        </div>
    </div>

    <!-- MAIN APP CONTAINER -->
    <div id="appContainer" class="container d-none">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <span class="text-light fs-5">Driver: <b id="displayDriverName" class="text-warning"></b></span>
            <button class="btn btn-outline-light btn-sm" onclick="logout()">Logout</button>
        </div>

        <h2 class="text-center my-3 text-light">Return Invoice Collector</h2>
         
        <div class="card p-3 mb-3">
            <div class="mb-3">
                <label class="form-label"><b>Return Entry Date:</b></label>
                <input type="date" id="entryDateInput" class="form-control">
            </div>

            <div class="mb-3">
                <label class="form-label"><b>1. Invoice Number:</b></label>
                <input type="text" id="invoiceNo" class="form-control" placeholder="Enter Invoice Number">
            </div>

            <div class="mb-3">
                <label class="form-label"><b>2. Select Brand:</b></label>
                <select id="brand" class="form-select" onchange="onBrandChange()">
                    <option value="">-- Choose Brand --</option>
                    <option value="Canteen">Canteen</option>
                    <option value="Trolley">Trolley</option>
                </select>
            </div>

            <div class="mb-3 autocomplete-wrapper">
                <label class="form-label"><b>3. Search/Select Branch:</b></label>
                <input type="text" id="branch" class="form-control" placeholder="Type to search branch..." oninput="filterBranchOptions()" onfocus="filterBranchOptions()" autocomplete="off">
                <div id="branchSuggestions" class="autocomplete-suggestions"></div>
            </div>
        </div>

        <div class="card p-3 mb-3 text-center">
            <h5><b>4. Fast Scan Barcode</b></h5>
            <div id="reader"></div>
            <input type="text" id="manualBarcode" class="form-control mt-2" placeholder="Or enter barcode manually">
            <button class="btn btn-secondary btn-sm mt-2" onclick="lookupBarcode(document.getElementById('manualBarcode').value)">Lookup Manual Barcode</button>
        </div>

        <div class="card p-3 mb-3">
            <h5><b>Item Details</b></h5>
            <div class="mb-2 autocomplete-wrapper">
                <label>Item Name:</label>
                <input type="text" id="itemName" class="form-control" placeholder="Type to search item..." oninput="filterItemOptions()" onfocus="filterItemOptions()" autocomplete="off">
                <div id="itemSuggestions" class="autocomplete-suggestions"></div>
            </div>

            <div class="row">
                <div class="col-6 mb-2">
                    <label>Unit Price:</label>
                    <input type="number" id="unitPrice" step="0.001" class="form-control" readonly>
                </div>
                <div class="col-6 mb-2">
                    <label>Qty:</label>
                    <input type="number" id="qty" class="form-control" value="1" min="1">
                </div>
            </div>

            <div class="row mb-3">
                <div class="col-6">
                    <label><b>Return Date:</b></label>
                    <input type="date" id="returnDateInput" class="form-control">
                </div>
                <div class="col-6">
                    <label><b>Production Date:</b></label>
                    <input type="date" id="prodDateInput" class="form-control">
                </div>
            </div>

            <button class="btn btn-success w-100" onclick="addReturnItem()">Add Item to Invoice</button>
        </div>

        <div class="card p-3 mb-3">
            <h5>Current Invoice Items</h5>
            <ul id="itemList" class="list-group mb-3"></ul>
            
            <div class="p-3 mb-3 bg-light border rounded d-flex justify-content-between align-items-center">
                <span class="fs-5 text-dark"><b>Invoice Total:</b></span>
                <span class="fs-4 text-success"><b>KWD <span id="invoiceTotalDisplay">0.000</span></b></span>
            </div>

            <button class="btn btn-primary w-100" id="saveInvoiceBtn" onclick="saveFullInvoice()">Finalize & Save Invoice</button>
        </div>
    </div>

    <script>
        // REPLACE THIS URL WITH YOUR GOOGLE APPS SCRIPT WEB APP URL
        const GOOGLE_SCRIPT_URL = "YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL_HERE";

        const userDatabase = {
            "shahbaz": { name: "Shahbaz", pass: "1234", role: "driver" },
            "abdullah": { name: "Abdullah", pass: "1234", role: "driver" },
            "rashid": { name: "Rashid", pass: "1234", role: "driver" },
            "admin": { name: "Amir khan", pass: "admin123", role: "admin" }
        };

        let currentUser = null;

        function formatDateToCustomString(dateObj) {
            if (!dateObj || isNaN(dateObj.getTime())) return "";
            const day = dateObj.getDate();
            const monthNames = ["January", "February", "March", "April", "May", "June",
                "July", "August", "September", "October", "November", "December"];
            return `${day} ${monthNames[dateObj.getMonth()]} ${dateObj.getFullYear()}`;
        }

        function parseInputDateToFormattedString(inputVal) {
            if (!inputVal) return "";
            const parts = inputVal.split('-');
            const d = new Date(parts[0], parts[1] - 1, parts[2]);
            return formatDateToCustomString(d);
        }

        function get12HourTimeString() {
            return new Date().toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true });
        }

        window.addEventListener('DOMContentLoaded', () => {
            const todayYMD = new Date().toISOString().split('T')[0];
            document.getElementById('entryDateInput').value = todayYMD;
            document.getElementById('returnDateInput').value = todayYMD;

            const savedUser = localStorage.getItem('currentUser');
            if (savedUser) {
                try {
                    currentUser = JSON.parse(savedUser);
                    applyUserSession(currentUser);
                } catch (e) {}
            }
        });

        function applyUserSession(user) {
            document.getElementById('displayDriverName').textContent = user.name;
            document.getElementById('loginSection').classList.add('d-none');
            document.getElementById('appContainer').classList.remove('d-none');
            initScanner();
        }

        function handleLogin() {
            const idInput = document.getElementById('loginId').value.trim().toLowerCase();
            const passInput = document.getElementById('loginPassword').value.trim();
            const user = userDatabase[idInput];

            if (user && user.pass === passInput) {
                currentUser = user;
                localStorage.setItem('currentUser', JSON.stringify(user));
                applyUserSession(user);
            } else {
                alert("Invalid User ID or Password!");
            }
        }

        function logout() {
            currentUser = null;
            localStorage.removeItem('currentUser');
            document.getElementById('appContainer').classList.add('d-none');
            document.getElementById('loginSection').classList.remove('d-none');
        }

        const productDatabase = {
            "7517846597753": { "name": "Beef Stroganoff with Penne Pasta", "canteenPrice": 1.625, "trolleyPrice": 1.575 },
            "7517846597241": { "name": "Butter Chicken", "canteenPrice": 1.411, "trolleyPrice": 1.361 },
            "7517846597142": { "name": "Chicken Caesar Salad", "canteenPrice": 1.268, "trolleyPrice": 1.268 }
        };

        const branchDatabase = {
            "Canteen": ["Waha (Canteen)", "Zain Headquater (Canteen)"],
            "Trolley": ["Jahra - Alfa (TR)", "Oyoon - Oula (TR)"]
        };

        let currentInvoiceItems = [];
        let html5QrcodeScanner = null;

        function onBrandChange() {
            document.getElementById('branch').value = "";
        }

        function filterBranchOptions() {
            const brand = document.getElementById('brand').value;
            const inputVal = document.getElementById('branch').value.toLowerCase();
            const container = document.getElementById('branchSuggestions');

            if (!brand) return alert("Select Brand first!");

            const matches = (branchDatabase[brand] || []).filter(b => b.toLowerCase().includes(inputVal));
            container.innerHTML = "";
            
            if (matches.length > 0) {
                matches.forEach(branchName => {
                    const div = document.createElement('div');
                    div.className = 'autocomplete-suggestion';
                    div.textContent = branchName;
                    div.onclick = () => {
                        document.getElementById('branch').value = branchName;
                        container.style.display = 'none';
                    };
                    container.appendChild(div);
                });
                container.style.display = 'block';
            } else {
                container.style.display = 'none';
            }
        }

        function filterItemOptions() {
            const inputVal = document.getElementById('itemName').value.toLowerCase();
            const container = document.getElementById('itemSuggestions');
            const matches = Object.values(productDatabase).map(i => i.name).filter(i => i.toLowerCase().includes(inputVal));

            container.innerHTML = "";
            if (matches.length > 0 && inputVal.length > 0) {
                matches.forEach(itemName => {
                    const div = document.createElement('div');
                    div.className = 'autocomplete-suggestion';
                    div.textContent = itemName;
                    div.onclick = () => {
                        document.getElementById('itemName').value = itemName;
                        container.style.display = 'none';
                        onItemSearchChange(itemName);
                    };
                    container.appendChild(div);
                });
                container.style.display = 'block';
            } else {
                container.style.display = 'none';
            }
        }

        function onItemSearchChange(typedName) {
            const brand = document.getElementById('brand').value;
            const entry = Object.entries(productDatabase).find(([b, d]) => d.name === typedName);
            if (entry) {
                document.getElementById('unitPrice').value = (brand === "Canteen") ? entry[1].canteenPrice : entry[1].trolleyPrice;
                document.getElementById('manualBarcode').value = entry[0];
            }
        }

        function initScanner() {
            if (!html5QrcodeScanner) {
                html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 20, qrbox: 250 });
                html5QrcodeScanner.render((text) => {
                    document.getElementById('manualBarcode').value = text;
                    lookupBarcode(text);
                });
            }
        }

        function lookupBarcode(barcode) {
            const brand = document.getElementById('brand').value;
            if (!brand) return alert("Select Brand first!");

            const item = productDatabase[barcode.trim()];
            if (item) {
                document.getElementById('itemName').value = item.name;
                document.getElementById('unitPrice').value = (brand === "Canteen") ? item.canteenPrice : item.trolleyPrice;
            }
        }

        function addReturnItem() {
            const barcode = document.getElementById('manualBarcode').value;
            const name = document.getElementById('itemName').value;
            const price = document.getElementById('unitPrice').value;
            const qty = document.getElementById('qty').value;
            const retDate = parseInputDateToFormattedString(document.getElementById('returnDateInput').value);
            const prodDate = parseInputDateToFormattedString(document.getElementById('prodDateInput').value);

            if (!name || !price || !qty || !retDate || !prodDate) {
                alert("Please fill in all item fields and dates!");
                return;
            }

            currentInvoiceItems.push({
                barcode: barcode,
                name: name,
                price: parseFloat(price),
                qty: parseInt(qty),
                returnDate: retDate,
                prodDate: prodDate
            });

            updateItemsUI();
            
            // Clear item input fields for next entry
            document.getElementById('itemName').value = '';
            document.getElementById('unitPrice').value = '';
            document.getElementById('manualBarcode').value = '';
            document.getElementById('qty').value = '1';
        }

        function updateItemsUI() {
            const list = document.getElementById('itemList');
            list.innerHTML = "";
            let total = 0;

            currentInvoiceItems.forEach((item, index) => {
                const subtotal = item.price * item.qty;
                total += subtotal;
                list.innerHTML += `<li class="list-group-item d-flex justify-content-between">
                    <div>
                        <b>${item.name}</b><br>
                        <small class="text-muted">Ret: ${item.returnDate} | Prod: ${item.prodDate} | Qty: ${item.qty}</small>
                    </div>
                    <div><b>KWD ${subtotal.toFixed(3)}</b></div>
                </li>`;
            });

            document.getElementById('invoiceTotalDisplay').textContent = total.toFixed(3);
        }

        function saveFullInvoice() {
            const entryDate = parseInputDateToFormattedString(document.getElementById('entryDateInput').value);
            const invoiceNo = document.getElementById('invoiceNo').value;
            const brand = document.getElementById('brand').value;
            const branch = document.getElementById('branch').value;

            if (!entryDate || !invoiceNo || !brand || !branch || currentInvoiceItems.length === 0) {
                alert("Complete the header info (including Return Entry Date) and add items first!");
                return;
            }

            const payload = currentInvoiceItems.map(item => ({
                entryDate: entryDate,
                returnDate: item.returnDate,
                invoiceNumber: invoiceNo,
                brand: brand,
                branchName: branch,
                barcode: item.barcode,
                itemName: item.name,
                unitPrice: item.price,
                qty: item.qty,
                totalPrice: (item.price * item.qty).toFixed(3),
                productionDate: item.prodDate,
                scanTime: get12HourTimeString(),
                driverName: currentUser ? currentUser.name : "Unknown"
            }));

            fetch(GOOGLE_SCRIPT_URL, {
                method: "POST",
                mode: "no-cors",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            }).then(() => {
                alert("Invoice Saved Successfully!");
                currentInvoiceItems = [];
                updateItemsUI();
                
                // Reset form fields
                document.getElementById('invoiceNo').value = '';
                document.getElementById('branch').value = '';
            });
        }
    </script>
</body>
</html>
